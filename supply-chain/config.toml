
# cargo-vet config file

[cargo-vet]
version = "0.10"

[imports.bytecode-alliance]
url = "https://raw.githubusercontent.com/bytecodealliance/wasmtime/main/supply-chain/audits.toml"

[imports.google]
url = "https://raw.githubusercontent.com/google/supply-chain/main/audits.toml"

[imports.isrg]
url = "https://raw.githubusercontent.com/divviup/libprio-rs/main/supply-chain/audits.toml"

[imports.mozilla]
url = "https://raw.githubusercontent.com/mozilla/supply-chain/main/audits.toml"

[imports.zcash]
url = "https://raw.githubusercontent.com/zcash/rust-ecosystem/main/supply-chain/audits.toml"

[[exemptions.aead]]
version = "0.5.2"
criteria = "safe-to-deploy"

[[exemptions.cfg-if]]
version = "1.0.5"
criteria = "safe-to-deploy"

[[exemptions.chacha20]]
version = "0.9.1"
criteria = "safe-to-deploy"
notes = "Not audited in this repo. The crate documents an external audit by NCC Group (2020, no significant findings): https://research.nccgroup.com/2020/02/26/public-report-rustcrypto-aes-gcm-and-chacha20poly1305-implementation-review/"

[[exemptions.chacha20poly1305]]
version = "0.10.1"
criteria = "safe-to-deploy"
notes = "Not audited in this repo. The crate documents an external audit by NCC Group (2020, no significant findings): https://research.nccgroup.com/2020/02/26/public-report-rustcrypto-aes-gcm-and-chacha20poly1305-implementation-review/"

[[exemptions.cpufeatures]]
version = "0.2.17"
criteria = "safe-to-deploy"

[[exemptions.crypto-common]]
version = "0.1.7"
criteria = "safe-to-deploy"

[[exemptions.curve25519-dalek]]
version = "4.1.3"
criteria = "safe-to-deploy"
notes = "Not audited in this repo, and the vendored crate documents no audit. Review before each update."

[[exemptions.curve25519-dalek-derive]]
version = "0.1.1"
criteria = "safe-to-deploy"

[[exemptions.digest]]
version = "0.10.7"
criteria = "safe-to-deploy"
notes = "Not audited in this repo. Traits and buffering glue under sha2/hmac; ISRG audited 0.9.0 (imported), not this version."

[[exemptions.generic-array]]
version = "0.14.7"
criteria = "safe-to-deploy"

[[exemptions.hkdf]]
version = "0.12.4"
criteria = "safe-to-deploy"
notes = "Not audited in this repo, and the vendored crate documents no audit. Small (RFC 5869 on top of hmac, which ISRG audited); checked here against the RFC 5869 vector."

[[exemptions.libc]]
version = "0.2.191"
criteria = "safe-to-deploy"

[[exemptions.poly1305]]
version = "0.8.0"
criteria = "safe-to-deploy"
notes = "Not audited in this repo. NCC Group audit (2020) per the crate README; it notes the AVX2 backend came later and is not covered: https://research.nccgroup.com/2020/02/26/public-report-rustcrypto-aes-gcm-and-chacha20poly1305-implementation-review/"

[[exemptions.proc-macro2]]
version = "1.0.107"
criteria = "safe-to-deploy"

[[exemptions.serde]]
version = "1.0.229"
criteria = "safe-to-deploy"

[[exemptions.serde_core]]
version = "1.0.229"
criteria = "safe-to-deploy"

[[exemptions.serde_derive]]
version = "1.0.229"
criteria = "safe-to-deploy"

[[exemptions.snow]]
version = "0.10.0"
criteria = "safe-to-deploy"
notes = "Not audited in this repo. Its README says it 'has not received any formal audit'. Only its handshake/transport state machine is used here; the primitives come from its default resolver (curve25519-dalek, chacha20poly1305, sha2). Checked here against the cacophony vector for Noise_XXpsk3_25519_ChaChaPoly_SHA256. Review before each update."

[[exemptions.syn]]
version = "2.0.119"
criteria = "safe-to-deploy"

[[exemptions.syn]]
version = "3.0.10"
criteria = "safe-to-deploy"

[[exemptions.typenum]]
version = "1.20.1"
criteria = "safe-to-deploy"

[[exemptions.unicode-ident]]
version = "1.0.27"
criteria = "safe-to-deploy"

[[exemptions.version_check]]
version = "0.9.5"
criteria = "safe-to-deploy"

[[exemptions.x25519-dalek]]
version = "2.0.1"
criteria = "safe-to-deploy"
notes = "Not audited in this repo, and the vendored crate documents no audit. Review before each update."

[[exemptions.zeroize_derive]]
version = "1.5.0"
criteria = "safe-to-deploy"
