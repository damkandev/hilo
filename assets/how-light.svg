<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="A Mac and a server; the server runs the anchor that orders every change" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#59636e"/></marker></defs>
<rect x="1" y="20" width="250" height="210" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="20" y="52" font-size="17" fill="#1f2328" font-weight="600">Your Mac</text>
<text x="20" y="72" font-size="13" fill="#59636e">~/code</text>
<text x="20" y="108" font-size="13.5" fill="#1f2328">your agents edit files</text>
<text x="20" y="134" font-size="13.5" fill="#1f2328">hooks + MCP take leases</text>
<text x="20" y="160" font-size="13.5" fill="#1f2328">FSEvents sees each write</text>
<text x="20" y="186" font-size="13.5" fill="#1f2328">env vars arrive sealed</text>
<rect x="409" y="20" width="350" height="210" rx="12" fill="#f6f8fa" stroke="#d1d9e0"/>
<text x="428" y="52" font-size="17" fill="#1f2328" font-weight="600">Your server</text>
<text x="428" y="72" font-size="13" fill="#59636e">~/code · agents · inotify</text>
<rect x="428" y="90" width="312" height="122" rx="10" fill="#ffffff" stroke="#0891b2" stroke-width="1.5"/>
<text x="446" y="118" font-size="15" fill="#0891b2" font-weight="600">anchor</text>
<text x="446" y="146" font-size="13.5" fill="#1f2328">gives every change a number</text>
<text x="446" y="170" font-size="13.5" fill="#1f2328">first write on a version wins</text>
<text x="446" y="194" font-size="13.5" fill="#1f2328">holds the lease table</text>
<line x1="257" y1="150" x2="403" y2="150" stroke="#59636e" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="330" y="138" font-size="12.5" fill="#59636e" text-anchor="middle">encrypted (Noise)</text>
<text x="330" y="172" font-size="12.5" fill="#59636e" text-anchor="middle">~50 ms per write</text>
</svg>