<svg xmlns="http://www.w3.org/2000/svg" width="760" height="250" viewBox="0 0 760 250" role="img" aria-label="Un Mac y un servidor; el servidor corre el ancla que ordena cada cambio" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#8b949e"/></marker></defs>
<rect x="1" y="20" width="250" height="210" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="20" y="52" font-size="17" fill="#e6edf3" font-weight="600">Tu Mac</text>
<text x="20" y="72" font-size="13" fill="#8b949e">~/code</text>
<text x="20" y="108" font-size="13.5" fill="#e6edf3">tus agentes editan archivos</text>
<text x="20" y="134" font-size="13.5" fill="#e6edf3">hooks + MCP toman leases</text>
<text x="20" y="160" font-size="13.5" fill="#e6edf3">FSEvents ve cada escritura</text>
<text x="20" y="186" font-size="13.5" fill="#e6edf3">las variables llegan cifradas</text>
<rect x="409" y="20" width="350" height="210" rx="12" fill="#161b22" stroke="#30363d"/>
<text x="428" y="52" font-size="17" fill="#e6edf3" font-weight="600">Tu servidor</text>
<text x="428" y="72" font-size="13" fill="#8b949e">~/code · agentes · inotify</text>
<rect x="428" y="90" width="312" height="122" rx="10" fill="#0d1117" stroke="#22d3ee" stroke-width="1.5"/>
<text x="446" y="118" font-size="15" fill="#22d3ee" font-weight="600">ancla</text>
<text x="446" y="146" font-size="13.5" fill="#e6edf3">numera cada cambio</text>
<text x="446" y="170" font-size="13.5" fill="#e6edf3">gana la primera escritura</text>
<text x="446" y="194" font-size="13.5" fill="#e6edf3">guarda la tabla de leases</text>
<line x1="257" y1="150" x2="403" y2="150" stroke="#8b949e" stroke-width="1.6" marker-end="url(#a)" marker-start="url(#a)"/>
<text x="330" y="138" font-size="12.5" fill="#8b949e" text-anchor="middle">cifrado (Noise)</text>
<text x="330" y="172" font-size="12.5" fill="#8b949e" text-anchor="middle">~50 ms por escritura</text>
</svg>