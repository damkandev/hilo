name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # attestations
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: macos-latest, target: x86_64-apple-darwin }
          # static (musl): runs on any Linux, old glibc or none (cloud sandboxes, Alpine)
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
    runs-on: ${{ matrix.os }}
    env:
      # secrets can't be read in `if:`; this can
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --offline --locked --target ${{ matrix.target }}
      - name: Sign and notarize (macOS, when the secrets exist)
        if: runner.os == 'macOS' && env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "$APPLE_CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security list-keychains -s build.keychain
          security unlock-keychain -p ci build.keychain
          codesign --force --options runtime --timestamp --sign "$APPLE_IDENTITY" target/${{ matrix.target }}/release/hilo
          ditto -c -k target/${{ matrix.target }}/release/hilo hilo.zip
          xcrun notarytool submit hilo.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
      - run: |
          mkdir dist
          tar -C target/${{ matrix.target }}/release -czf dist/hilo-${{ matrix.target }}.tar.gz hilo
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/hilo-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hilo-${{ matrix.target }}
          path: dist/

  # hilo.app (Apple silicon) in hilo-macos.dmg: the app and the CLI inside it. Signed and notarized
  # when the Apple secrets exist; otherwise ad hoc, and macOS asks once before opening it.
  mac-app:
    runs-on: macos-latest
    env:
      HAS_APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Keychain with the signing certificate
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$APPLE_CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security list-keychains -s build.keychain
          security unlock-keychain -p ci build.keychain
      - run: app/bundle.sh
        env:
          SIGN_ID: ${{ env.HAS_APPLE_CERT == 'true' && secrets.APPLE_IDENTITY || '' }}
      - name: Notarize
        if: env.HAS_APPLE_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          xcrun notarytool submit app/dist/hilo-macos.dmg --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple app/dist/hilo-macos.dmg
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: app/dist/hilo-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: hilo-macos-app
          path: app/dist/hilo-macos.dmg

  publish:
    needs: [build, mac-app]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum hilo-*.tar.gz hilo-macos.dmg > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
