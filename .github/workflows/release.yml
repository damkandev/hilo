name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write      # attestations
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: ubuntu-24.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --offline --locked --target ${{ matrix.target }}
      - name: Sign and notarize (macOS, when the secrets exist)
        if: runner.os == 'macOS' && env.APPLE_CERT != ''
        env:
          APPLE_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          echo "$APPLE_CERT" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          security list-keychains -s build.keychain
          security unlock-keychain -p ci build.keychain
          codesign --force --options runtime --timestamp --sign "$APPLE_IDENTITY" target/${{ matrix.target }}/release/hilo
          ditto -c -k target/${{ matrix.target }}/release/hilo hilo.zip
          xcrun notarytool submit hilo.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
      - run: |
          mkdir dist
          tar -C target/${{ matrix.target }}/release -czf dist/hilo-${{ matrix.target }}.tar.gz hilo
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/hilo-${{ matrix.target }}.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: hilo-${{ matrix.target }}
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum hilo-*.tar.gz > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
