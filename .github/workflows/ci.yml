name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false # each platform reports on its own
      matrix:
        os: [macos-latest, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    env:
      HILO_KEYCHAIN: "0"
      HILO_NOTIFY: "0"
    steps:
      - uses: actions/checkout@v5
      - run: git config --global user.email ci@hilo && git config --global user.name ci
      # vendored crates only: the build never touches the network
      - run: cargo test --release --offline --locked
      - run: cargo build --release --offline --locked && ls -la target/release/hilo

  windows:
    # builds and links on real Windows; the test suite still assumes a Unix box, so it only compiles
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - run: cargo test --release --offline --locked --no-run
      - run: cargo build --release --offline --locked

  # the Mac app: its own workspace, crates.io instead of vendor/, so it builds outside the repo's cargo config
  app:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: cd / && cargo check --locked --manifest-path "$GITHUB_WORKSPACE/app/Cargo.toml"

  vet:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - run: cargo install cargo-vet --locked
      - run: cargo vet --locked
